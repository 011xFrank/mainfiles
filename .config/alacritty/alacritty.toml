[general]
import = [
  "~/mainfiles/.config/alacritty/themes/koda.toml"
]

[font]
normal = { family = "FiraCode Nerd Font", style = "Medium" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }
bold_italic = { family = "FiraCode Nerd Font", style = "Bold" }
size = 8
offset.x = 0
offset.y = 2

# Shifting the glyph down by 2 pixels centers it perfectly within the 4px extra height
glyph_offset = { x = 0, y = 1 }

[window]
padding = { x = 0, y = 0 }
opacity = 0.97
decorations = "none"
startup_mode = "maximized"

[cursor]
style = "block"
