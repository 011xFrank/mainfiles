[font]
size = 9
glyph_offset = { x = 0, y = 1 }

[font.normal]
family = "FiraCode Nerd Font"
style = "Medium"

[font.bold]
family = "FiraCode Nerd Font"
style = "Medium"

[font.italic]
family = "FiraCode Nerd Font"
style = "Retina"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 2

[window]
#padding = { x = 0, y = 0 }
opacity = 0.9
decorations = "none"
startup_mode = "maximized"

[cursor]
style = "block"

[colors]
primary = { background = "#0d0b00" }
