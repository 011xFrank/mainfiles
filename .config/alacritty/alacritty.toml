#[general]
#import = [
#  "~/mainfiles/.config/alacritty/themes/koda.toml"
#]

[font]
normal = { family = "FiraCode Nerd Font", style = "Semibold" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }
bold_italic = { family = "FiraCode Nerd Font", style = "Bold" }
size = 8
offset.x = 0
offset.y = 2

# Shifting the glyph down by 2 pixels centers it perfectly within the 4px extra height
glyph_offset = { x = 0, y = 1 }

[window]
padding = { x = 5, y = 5 }
opacity = 0.97
decorations = "none"
startup_mode = "maximized"

[cursor]
style = "block"

[env]
TERM="xterm-256color"

# Rosé Pine Moon theme for Alacritty
[colors]
# Default colors
primary = { background = "0x000000", foreground = "0xe0def4" }

# Cursor colors
cursor = { text = "0x232136", cursor = "0xe0def4" }

# Selection colors
selection = { text = "0xe0def4", background = "0x393552" }

# Normal colors
normal = { black = "0x393552", red = "0xeb6f92", green = "0x9ccfd8", yellow = "0xf6c177", blue = "0x3e8fb0", magenta = "0xc4a7e7", cyan = "0xea9a97", white = "0xe0def4" }

# Bright colors
bright = { black = "0x6e6a86", red = "0xeb6f92", green = "0x9ccfd8", yellow = "0xf6c177", blue = "0x3e8fb0", magenta = "0xc4a7e7", cyan = "0xea9a97", white = "0xe0def4" }

# Extended / Indexed colors
indexed_colors = [
    { index = 16, color = "0xea9a97" }
]
