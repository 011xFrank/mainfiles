[general]
import = [
  "~/mainfiles/.config/alacritty/themes/koda.toml"
]

[font]
normal = { family = "JetbrainsMono Nerd Font", style = "Bold" }
bold = { family = "JetbrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetbrainsMono Nerd Font", style = "Bold" }
bold_italic = { family = "JetbrainsMono Nerd Font", style = "Bold" }
size = 7.5
offset.x = 0
offset.y = 5

[window]
padding = { x = 10, y = 10 }
opacity = 0.97
decorations = "none"
startup_mode = "maximized"

[cursor]
style = "block"
