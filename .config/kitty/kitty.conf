# Font configuration
font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font
italic_font      FiraCode Nerd Font
bold_italic_font FiraCode Nerd Font
font_size        10.0

# Cursor
cursor_shape     block

# Window appearance
background_opacity 0.90
hide_window_decorations yes
startup_session  none
# Note: Kitty does not have a direct "maximized" config option in kitty.conf; 
# launch kitty with `--start-as=maximized` or set your OS/WM rules.

# Environment
env TERM=xterm-256color

# Colors
background #0e0b00
